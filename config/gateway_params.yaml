safety_gateway_node:
  ros__parameters:
    input_topic: motion_control_web/motor_command_request
    output_topic: motion_control/motor_command
    min_command_interval_sec: 0.05
    bounds_enabled: true
    # Placeholder limits - these are NOT tuned to real hardware. Replace with
    # the actual per-motor limits from files/motor_manager before field use.
    max_abs_position: 1.0e6
    max_abs_velocity: 1.0e6
    max_abs_effort: 1.0e6
